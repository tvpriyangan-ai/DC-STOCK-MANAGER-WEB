<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DC Stock Manager - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">

    <h1 class="login-title">DC STOCK MANAGER</h1>
    <p class="login-subtitle">Inventory Management System</p>

    <div class="login-logo">
      <img src="images/logo_v2.jpeg" alt="DC Electricals" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none;">DC</div>
    </div>

    <form id="loginForm" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <label class="checkbox-row">
        <input type="checkbox" id="showPassword">
        Show Password
      </label>

      <p id="loginError" class="error-text"></p>

      <button type="submit" class="btn btn-green btn-block">LOGIN</button>
    </form>

    <p class="footer-text">© TVP CREATIONS 2026</p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
